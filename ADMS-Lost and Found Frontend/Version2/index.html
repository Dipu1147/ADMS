<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found Object Management System - Version 2</title>
    
    <!-- Add Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Add Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    <!-- Add AOS (Animate on Scroll) CSS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Link to Custom CSS for additional styling -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1 class="text-center my-4" data-aos="fade-down">Lost and Found Object Management System - Version 2</h1>

        <!-- Success or Error message -->
        <div id="statusMessage" class="alert" style="display: none;"></div>

        <!-- Form for entering lost/found objects -->
        <div class="card" data-aos="fade-up">
            <div class="card-body">
                <h3>Add or Update a Lost/Found Object</h3>
                <form id="objectForm">
                    <input type="hidden" id="objectId"> <!-- Hidden field to hold the object ID for updates -->
                    <div class="mb-3">
                        <label for="objectName" class="form-label"><i class="fas fa-cogs"></i> Object Name</label>
                        <input type="text" class="form-control" id="objectName" required placeholder="Enter object name">
                    </div>
                    <div class="mb-3">
                        <label for="objectDescription" class="form-label"><i class="fas fa-pencil-alt"></i> Description</label>
                        <textarea class="form-control" id="objectDescription" rows="3" required placeholder="Describe the object"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="objectLocation" class="form-label"><i class="fas fa-map-marker-alt"></i> Location Found/Lost</label>
                        <input type="text" class="form-control" id="objectLocation" required placeholder="Where was it found/lost?">
                    </div>
                    <div class="mb-3">
                        <label for="objectDate" class="form-label"><i class="fas fa-calendar-alt"></i> Date</label>
                        <input type="date" class="form-control" id="objectDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" data-bs-toggle="tooltip" title="Submit the object">
                        <i class="fas fa-paper-plane"></i> Submit
                    </button>
                </form>
            </div>
        </div>

        <!-- Table to display lost/found objects -->
        <div class="card mt-4" data-aos="fade-left">
            <div class="card-body">
                <h3>Objects List</h3>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover" id="objectsTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Object Name</th>
                                <th>Description</th>
                                <th>Location</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Objects data will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS, Popper.js, and AOS JS for animations -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.1/dist/aos.js"></script>

    <!-- Link to Custom JavaScript File -->
    <script src="js/app.js"></script>

    <script>
        // Initialize AOS (Animate on Scroll)
        AOS.init();
        
        // Enable Bootstrap tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    </script>
</body>
</html>
