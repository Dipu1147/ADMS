<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found Object Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Lost and Found Object Management System</h1>

        <!-- Form for entering lost/found objects -->
        <div class="card">
        <div class="card-body">
        <h3>Add a Lost/Found Object</h3>
          <form id="objectForm">
        <div class="mb-3">
          <label for="objectName" class="form-label">Object Name</label>
          <input type="text" class="form-control" id="objectName" required>
        </div>
        <div class="mb-3">
            <label for="objectDescription" class="form-label">Description</label>
             <textarea class="form-control" id="objectDescription" rows="3" required></textarea>
         </div>
        <div class="mb-3">
         <label for="objectLocation" class="form-label">Location Found/Lost</label>
        <input type="text" class="form-control" id="objectLocation" required>
        </div>
        <div class="mb-3">
             <label for="objectDate" class="form-label">Date</label>
             <input type="date" class="form-control" id="objectDate" required>
        </div>
             <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            </div>
        </div>

        <!-- Table to display lost/found objects -->
        <div class="card mt-4">
            <div class="card-body">
                <h3>Objects List</h3>
                <table class="table table-bordered" id="objectsTable">
                    <thead>
                        <tr>
                            <th>Object Name</th>
                            <th>Description</th>
                            <th>Location</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Objects data will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
